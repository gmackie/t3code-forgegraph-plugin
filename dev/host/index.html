<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForgeGraph MCP Apps · dev host</title>
    <style>
      :root { color-scheme: light; --bg: #eef0f3; --card: #fff; --text: #1f2328; --muted: #656d76; --border: #d8dee4; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #0d0f12; --card: #16181d; --text: #e6edf3; --muted: #8d96a0; --border: #30363d; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
      header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); }
      header h1 { font-size: 15px; margin: 0; flex: 1; }
      header code { color: var(--muted); }
      button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      #views { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; padding: 16px 20px; align-items: start; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
      .card h3 { margin: 10px 12px 0; font-size: 13px; }
      .card .sub { margin: 2px 12px 8px; color: var(--muted); font-size: 11px; }
      iframe { display: block; width: 100%; height: 320px; border: 0; border-top: 1px solid var(--border); }
      #log { margin: 0 20px 20px; padding: 10px; max-height: 160px; overflow: auto; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font: 11px ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <h1>ForgeGraph MCP Apps · dev host <small>(AppBridge, @modelcontextprotocol/ext-apps 1.7.5)</small></h1>
      <code id="server"></code>
      <button id="theme">Toggle theme</button>
    </header>
    <div id="views"></div>
    <pre id="log"></pre>
    <script type="module" src="/client.js"></script>
  </body>
</html>
